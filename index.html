<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Cuan Affiliate — AkbarKit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090d16; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    header { background-color: #0f172a; border-bottom: 1px solid #1e293b; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
    .nav-wrap { max-width: 440px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    
    /* Logo Bulat AkbarKit */
    .brand-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1.5px solid #d4af37; box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3); }
    
    .brand-title { font-weight: 700; font-size: 16px; color: #ffffff; display: flex; flex-direction: column; }
    .brand-tag { font-size: 10px; color: #34d399; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .nav-btn { font-size: 12px; background: #1e293b; border: 1px solid #334155; color: #34d399; padding: 6px 12px; border-radius: 99px; text-decoration: none; font-weight: 600; }
    main { max-width: 440px; width: 100%; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
    .hero { text-align: center; }
    .hero h2 { font-size: 22px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
    .hero p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input, select { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 12px 14px; color: #ffffff; font-size: 15px; font-weight: 600; outline: none; }
    input:focus, select:focus { border-color: #10b981; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-primary { width: 100%; background: #10b981; color: #020617; font-weight: 800; font-size: 15px; padding: 14px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-primary:active { transform: scale(0.98); }
    .result-card { background: linear-gradient(145deg, #064e3b 0%, #0f172a 100%); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .result-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(16, 185, 129, 0.2); padding-bottom: 12px; font-size: 13px; color: #cbd5e1; }
    .result-top strong { font-size: 16px; color: #34d399; }
    .stat-box { background: rgba(2, 6, 23, 0.7); border: 1px solid #1e293b; border-radius: 12px; padding: 12px; text-align: center; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .stat-val { font-size: 20px; font-weight: 800; margin-top: 4px; color: #ffffff; }
    .stat-val.green { color: #34d399; }
    .click-box { background: rgba(2, 6, 23, 0.7); border: 1px solid #1e293b; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .click-val { font-size: 18px; font-weight: 800; color: #fbbf24; }
    .cta-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
    .cta-tag { font-size: 11px; font-weight: 700; color: #34d399; text-transform: uppercase; letter-spacing: 0.6px; }
    .cta-desc { font-size: 13px; color: #cbd5e1; line-height: 1.45; }
    .btn-white { display: block; width: 100%; background: #ffffff; color: #020617; font-weight: 700; font-size: 14px; padding: 12px; border-radius: 12px; text-decoration: none; }
    footer { text-align: center; padding: 16px; font-size: 12px; color: #64748b; border-top: 1px solid #0f172a; }
  </style>
</head>
